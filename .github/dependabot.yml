version: 2

updates:
  # Workflow actions are SHA-pinned, which means they no longer pick up upstream security patches
  # on their own. This is what replaces that, so the cadence is deliberately tighter than Gradle's.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # The library has zero runtime dependencies, so everything here is test-only and carries no risk
  # to consumers. Monthly keeps a low-activity repo from accumulating stale PRs.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    groups:
      test-dependencies:
        patterns:
          - "*"
