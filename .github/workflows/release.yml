name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: this job holds SIGNING_KEY and the Central
      # Portal credentials, and a tag can be repointed at attacker-controlled code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Require every release secret
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          for secret in CENTRAL_PORTAL_USERNAME CENTRAL_PORTAL_PASSWORD SIGNING_KEY SIGNING_PASSPHRASE; do
            if [ -z "${!secret}" ]; then
              echo "::error::Secret $secret is unset. Signing is opt-in in build.gradle.kts, so a missing SIGNING_KEY would produce unsigned artifacts that Central rejects."
              exit 1
            fi
          done

      # TAG_NAME is passed through env rather than interpolated into the script body, so a hostile
      # tag name cannot inject shell.
      - name: Require the tag to match the project version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          project_version="$(./gradlew -q properties | awk '$1 == "version:" { print $2 }')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag ${TAG_NAME} implies ${tag_version} but build.gradle.kts declares ${project_version}. Central publications are irrevocable, so refusing to publish a mismatched coordinate."
            exit 1
          fi

      - name: Build and verify
        run: ./gradlew spotlessCheck build

      - name: Stage the deployment on the Central Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: ./gradlew publishAggregationToCentralPortal

      - name: Report that the deployment awaits manual release
        run: echo "::notice::Deployment staged but NOT public. Publish it at https://central.sonatype.com/publishing/deployments - see RELEASING.md."
